# constants.yaml — the single source of truth for every number in the codebase.
# No number is hardcoded anywhere else. Load with lab.constants.load_constants(),
# which coerces scientific-notation strings to float defensively.
#
# Provenance tag on every value:
#   paper    — arXiv:2605.00515 (SpaceMoE). Constants verified against the PDF;
#              the token latency is Table II's 1.02-1.07 s/token RANGE.
#   spec     — public datasheet or cited paper; cite directly.
#   estimate — our assumption; needs a sensitivity check before camera-ready.
#   derived  — computed from tagged values above.
#
# PyYAML scientific-notation quirk: PyYAML parses a float only when the token
# has a decimal point (e.g. 2.998e8) or a signed exponent (e.g. 1e+8). A bare
# "1e14" is parsed as a STRING. Every sci-notation value below is written with a
# decimal point so it parses as float, AND the loader coerces any that slip
# through. Do not "simplify" 3.986e14 to 3986e11 without a dot.

physical:
  mu_earth_m3_s2:  {value: 3.986e14, prov: derived}   # standard gravitational parameter
  earth_radius_km: {value: 6371.0,   prov: spec}      # IUGG mean radius
  c_m_s:           {value: 2.998e8,  prov: spec}      # speed of light; laser ISLs are vacuum, no fiber slowdown
  omega_earth_rad_s: {value: 7.2921159e-5, prov: spec} # sidereal rotation rate (IERS)

# Ground links. Source mode is set per workflow (workflows/*.yaml `source`):
# `satellite` means the image is captured on the ingress satellite (no
# uplink term); `ground` means the request uplinks its payload at the uplink
# rate. The result always downlinks from the last component's satellite via
# the nearest AoI-visible satellite at the downlink rate. Ka-band
# gateway-class rates.
links:
  ground_uplink_gbps:   {value: 2.5, prov: estimate}
  ground_downlink_gbps: {value: 1.0, prov: estimate}

# The planning cycle: one sidereal day. Evaluation shells sit at
# repeat-ground-track altitudes (15 and 14 revolutions per sidereal day), so
# the AoI-relative geometry repeats exactly every cycle in the two-body model.
# IERS value.
cycle:
  sidereal_day_s: {value: 86164.0905, prov: spec}

# Walker constellations. topology in {star, delta}. n_planes = Nx, sats_per_plane
# = Ny, phasing_f = F. Star spreads RAAN over pi (a seam); Delta over 2pi (a torus).
constellations:
  ref-star:
    topology: star
    altitude_km: 550.0
    inclination_deg: 87.0
    n_planes: 33
    sats_per_plane: 32
    phasing_f: 13
    isl_rate_gbps: 100.0   # SpaceMoE states ">=100 Gbps", a floor; we use the floor
    link_survival: 0.95
    prov: paper
  starlink-s1:
    topology: delta
    altitude_km: 550.0
    inclination_deg: 53.0
    n_planes: 72
    sats_per_plane: 22
    phasing_f: null
    isl_rate_gbps: 100.0
    link_survival: 0.95
    prov: spec
  kuiper-s1:
    topology: delta
    altitude_km: 630.0
    inclination_deg: 51.9
    n_planes: 34
    sats_per_plane: 34
    phasing_f: null
    isl_rate_gbps: 100.0
    link_survival: 0.95
    prov: spec
  oneweb:
    topology: star
    altitude_km: 1200.0
    inclination_deg: 87.9
    n_planes: 12
    sats_per_plane: 49
    phasing_f: null
    isl_rate_gbps: 100.0
    link_survival: 0.95
    prov: spec
  # Controlled pair: identical in every parameter except RAAN span (the
  # topology class), so the Star-vs-Delta path-cost difference they exhibit is
  # the pure seam effect with inclination held fixed. Not a real system.
  ctrl-star:
    topology: star
    altitude_km: 550.0
    inclination_deg: 60.0
    n_planes: 30
    sats_per_plane: 30
    phasing_f: 1
    isl_rate_gbps: 100.0
    link_survival: 0.95
    prov: estimate
  ctrl-delta:
    topology: delta
    altitude_km: 550.0
    inclination_deg: 60.0
    n_planes: 30
    sats_per_plane: 30
    phasing_f: 1
    isl_rate_gbps: 100.0
    link_survival: 0.95
    prov: estimate

# Verified geometry, derived and cross-checked by hand. These are the substrate
# sanity-test targets: the walker must reproduce each within 1 percent.
# Intra-plane hop d = 2 a sin(pi/Ny); inter-plane equatorial hop = 2 a sin(dOmega/2)
# with dOmega = pi/Nx (star) or 2 pi/Nx (delta).
verified_hops:
  intra_plane_ms:            # d = 2 a sin(pi / Ny), a = R + h
    ref-star:    {value: 4.53, prov: derived}
    starlink-s1: {value: 6.57, prov: derived}
    kuiper-s1:   {value: 4.31, prov: derived}
    oneweb:      {value: 3.24, prov: derived}
  inter_plane_equator_ms:    # node separation dOmega along the equator
    ref-star:    {value: 2.20, prov: derived}
    starlink-s1: {value: 2.01, prov: derived}
    kuiper-s1:   {value: 4.31, prov: derived}
    oneweb:      {value: 6.59, prov: derived}
  # Invariant: a/c is 23.1 to 25.3 ms/rad across all four; results are quoted in
  # hop-equivalents for portability.

# Hardware ladder. Detector execution times come from MEASURED per-device profiles
# in ladders/*.yaml (lab.profiles); the roofline
# T_exec = max(FLOPs/(f_peak * duty), bytes/BW) is only the fallback for devices
# without published measurements (RAD5545, SBC-2A72). duty_cycle therefore
# matters only on the fallback path.
duty_cycle: {value: 0.70, prov: paper}   # thermal utilization u (SpaceMoE)

devices:
  RAD5545:
    peak_flops:   {value: 3.7e9,   prov: paper}      # 3.7 GFLOPS; BAE datasheet
    mem_bytes:    {value: 4.0e9,   prov: paper}
    mem_bw_bytes_s: {value: 3.0e9, prov: estimate}   # DDR-class estimate
  SBC-2A72:
    peak_flops:   {value: 10.4e9,  prov: paper}      # Frontgrade SBC-2A72, paper baseline
    mem_bytes:    {value: 8.0e9,   prov: paper}
    mem_bw_bytes_s: {value: 10.0e9, prov: estimate}
  iX10:
    peak_flops:   {value: 26.0e12, prov: spec}       # 26 TOPS INT8 = Hailo-8 accelerator
    mem_bytes:    {value: 24.0e9,  prov: spec}       # 24 GB DDR4 ECC, Unibap datasheet
    mem_bw_bytes_s: {value: 30.0e9, prov: estimate}  # the one sensitive bandwidth estimate
    note: >
      26 TOPS traces to the SpaceCloud iX10-102 variant (Hailo-8 M.2,
      "up to 26 TOPS at 8-bit" per Hailo datasheet). The iX10-101
      (Movidius Myriad X) is only ~4 TOPS. Prose must say "iX10-102 (Hailo-8)".
  Orin:
    peak_flops:   {value: 275.0e12, prov: spec}      # Jetson AGX Orin, 275 TOPS INT8 sparse
    mem_bytes:    {value: 64.0e9,   prov: spec}
    mem_bw_bytes_s: {value: 204.8e9, prov: spec}
  OrinNano:
    peak_flops:   {value: 67.0e12,  prov: spec}      # Orin Nano Super mode, 67 TOPS INT8 sparse
    mem_bytes:    {value: 8.0e9,    prov: spec}
    mem_bw_bytes_s: {value: 102.0e9, prov: spec}
    note: >
      Measured device: YOLOv8 batch-1 FP16 PyTorch latencies in
      ladders/yolo_coco.yaml, prov measured; raw log in ladders/provenance/.
      Roofline underestimates it by 14-139x at batch 1 (launch-overhead-bound),
      the strongest evidence for the measured-profiles decision.
  H100:
    peak_flops:   {value: 989.0e12, prov: spec}      # H100 SXM FP16 dense, half of the
                                                     # datasheet's 1979 TFLOPS FP16 sparse;
                                                     # on orbit per Starcloud-1
    mem_bytes:    {value: 80.0e9,   prov: spec}
    mem_bw_bytes_s: {value: 3.35e12, prov: spec}

# Provisioning price vector. Relative cost units, monotone in hardware cost;
# the frontier SHAPE is robust to any monotone vector (stated in prose), so
# absolute values are estimates.
prices:
  RAD5545:  {value: 1.0,  prov: estimate}
  SBC-2A72: {value: 2.0,  prov: estimate}
  iX10:     {value: 4.0,  prov: estimate}
  OrinNano: {value: 6.0,  prov: estimate}
  Orin:     {value: 8.0,  prov: estimate}
  H100:     {value: 50.0, prov: estimate}

# Fleet mixes for evaluation.
# fractions: seeded per-node class assignment; strong_classes: classes the
# candidate search detours to; base: the class the sensor is drawn from.
fleet_mixes:
  all-mid-tier:  {description: "every node iX10-class", prov: estimate}
  sparse-strong: {strong_device: H100, strong_fraction: 0.02, rest_device: iX10, prov: estimate}
  graded:
    # Mid-tier is the MEASURED OrinNano, not the unmeasured AGX Orin.
    fractions: {H100: 0.02, OrinNano: 0.08, iX10: 0.5, SBC-2A72: 0.4}
    strong_classes: [H100, OrinNano]
    base: iX10
    prov: estimate

# Worked-example workload. Fixed-cost components in GFLOPs, data volumes in bytes.
# The detect ladder lives in ladders/yolo_coco.yaml.
e0:
  aoi: {description: "mid-latitude region", prov: estimate}
  constellation: ref-star
  fleet: sparse-strong
  pipeline:
    ingest:  {tile_bytes: {value: 150.0e6, prov: estimate}}                    # 150 MB multispectral tile
    screen:  {flops: {value: 5.0e9, prov: estimate},                           # fixed 5 GFLOPs
              out_bytes: {value: 10.0e6, prov: estimate},                      # 10 MB candidate patches
              recall_factor: {value: 0.98, prov: estimate}}                    # multiplicative upstream recall
    detect:  {ladder: yolo_coco, crops_per_tile: {value: 500, prov: estimate}, # ~hundreds of crops per tile
              out_bytes: {value: 5.0e5, prov: estimate}}                        # detections passed to spread

    spread:  {flops: {value: 2.0e9, prov: estimate}, out_bytes: {value: 1.0e6, prov: estimate}}
    alert:   {out_bytes: {value: 10.0e3, prov: estimate}}                      # 10 KB
  slo_seconds: {value: 2.0, prov: estimate}
  # SLO is set in the low-seconds range so the weak-node compute cap is visible.
  # FLOPs, mAP, device throughputs, and hop count k are all measured or cited.
