# E2 accuracy coupling (cascade reframe 2026-08-25). Numbers for devices,
# prices, and links come from constants.yaml; workflow + config space from
# workflows/ and ladders/. This file only sets the instance grid.
#
# NOTE: until ladders/cascade_grid_measured.yaml lands, accuracy comes from the
# flagged placeholder grid -> this run validates MACHINERY and mechanism
# structure; its numbers must not reach the paper (acc_source column says so).
seed: 0
workflow: wildfire
constellations: [ctrl-star, ctrl-delta, ref-star, starlink-s1]
aois: [mid_latitude, arctic]
# 0.002 is the capability-poor corner (2-3 strong sats in the whole shell).
capable_fractions: [0.002, 0.01, 0.05, 0.2]
# Dense sub-second band: the crossover where detour propagation competes with
# compute (E0 found detour-infeasibility at 0.55 s), then the relaxed decades.
slos_s: [0.5, 0.55, 0.6, 0.65, 0.7, 0.85, 1.0, 2.0, 4.0, 8.0]
fleet_seeds: [0, 1, 2]
candidates_k: 3          # detector/verifier candidates = sensor + k nearest strong
# EQ2 frontier: one designated instance, budget swept at fixed SLO. Graded
# fleet mix (H100/Orin/iX10/SBC-2A72) so the frontier has middle steps; the
# spread grid above stays sparse-strong.
frontier:
  constellation: ref-star
  aoi: mid_latitude
  mix: graded
  slos_s: [0.85, 1.0, 2.0]   # tighter SLOs keep the top tier relevant
  budgets: [6, 8, 10, 12, 16, 20, 28, 40, 54, 70, 90, 120, .inf]
