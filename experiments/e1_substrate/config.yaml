# E1 substrate characterization. Numbers come from constants.yaml, not here.
# The controlled pair (ctrl-star/ctrl-delta) isolates the seam effect at fixed
# inclination; the four real constellations give realistic path costs and the
# latitude cap. Star class: ctrl-star, ref-star, oneweb. Delta: ctrl-delta,
# starlink-s1, kuiper-s1.
seed: 0
constellations: [ctrl-star, ctrl-delta, ref-star, oneweb, starlink-s1, kuiper-s1]
star_class: [ctrl-star, ref-star, oneweb]
delta_class: [ctrl-delta, starlink-s1, kuiper-s1]
capable_fractions: [0.01, 0.05, 0.2, 1.0]
k_sources: 60          # sampled source nodes for path-cost distributions
n_snapshots: 12        # snapshots over one orbital period for coverage
# Go/no-go references (HA2): the controlled pair isolates the seam; the real
# classes show the latitude cap.
seam_pair: {star: ctrl-star, delta: ctrl-delta}
cap_pair: {star: ref-star, delta: starlink-s1}
